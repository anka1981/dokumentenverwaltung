name: Image bauen und veröffentlichen

# Baut das Add-on für Raspberry Pi (aarch64) und PC (amd64) und legt es in der
# GitHub Container Registry ab. Home Assistant lädt das fertige Image nur noch
# herunter, statt es auf dem Pi zu bauen.
on:
  push:
    branches: [main]
    paths:
      - "dokumentenverwaltung/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v5
      - name: Version lesen
        id: version
        run: |
          version=$(sed -nE 's/^version: *"?([^"]+)"?$/\1/p' dokumentenverwaltung/config.yaml)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: dokumentenverwaltung
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-dokumentenverwaltung:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-dokumentenverwaltung:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Image prüfen (Tesseract und App starten)
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-dokumentenverwaltung:${{ steps.version.outputs.version }}
          docker run --rm --platform ${{ matrix.platform }} --entrypoint "" "$IMG" tesseract --list-langs
          docker run --rm --platform ${{ matrix.platform }} --entrypoint "" "$IMG" sh -c "command -v jpegtran && /opt/venv/bin/python -c 'import pikepdf; print(pikepdf.__version__)'"
          docker run --rm --platform ${{ matrix.platform }} --entrypoint "" "$IMG" \
            /opt/venv/bin/python -c "import sys; sys.path.insert(0, '/app'); from dms import create_app, extract; create_app('/tmp/d'); assert extract.ocr_available(); print('ok')"
