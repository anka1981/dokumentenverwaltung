name: Dokumentenverwaltung
version: "1.0.0"
slug: dokumentenverwaltung
description: >-
  Dokumente per Datei oder Handy-Scan einspielen, Text kostenlos erkennen (Tesseract),
  verschlagworten und mit Ablagevorschlag einsortieren.
url: https://github.com/anka1981/dokumentenverwaltung
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_stream: true
panel_icon: mdi:file-document-multiple-outline
panel_title: Dokumente
map:
  - share:rw
options:
  passwort: ""
  ablage_im_share: false
schema:
  passwort: password?
  ablage_im_share: bool
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Direkter Zugriff ohne Home Assistant (nur mit Passwort)
